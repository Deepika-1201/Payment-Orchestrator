openapi: 3.1.0
info:
  title: Payment Gateway Merchant API
  version: 1.0.0
  description: |
    Server-to-server API for merchants. Create a payment, confirm it with a payment method, and follow
    `next_action` until the payment reaches a final status. Alternatively, create a checkout session and
    redirect the customer to its hosted page.

    - **Authentication**: `Authorization: Bearer sk_...`. The key is a server-side secret; never ship it to a
      browser or an app.
    - **Idempotency**: every `POST` requires an `Idempotency-Key` (1-255 visible ASCII characters). A retry with
      the same key and body returns the original response with `Idempotent-Replayed: true`. The same key with a
      different body is rejected with `422 idempotency_key_reuse`. Keys are kept for 7 days.
    - **Format**: JSON in snake_case. Amounts are integers in minor units (paise for INR). Timestamps are RFC 3339
      in UTC. Fields without a value are omitted rather than sent as `null`. Clients must ignore unknown fields.
    - **Errors**: RFC 9457 problem details (`application/problem+json`) with a stable machine-readable `code`.
    - **Rate limits**: separate per-merchant budgets for reads (`GET`) and writes. Over budget you get
      `429 rate_limited` with `Retry-After`; the request was not processed and did not consume its
      `Idempotency-Key`, so retry it unchanged.
    - **Outcomes are asynchronous**: a `200` from `confirm` means the attempt started, not that money moved. Rely
      on webhooks (see `webhooks`) or `GET /v1/payments/{payment_id}` for the final status.
    - **Recurring payments**: register a mandate once, then create debits on it. Each debit is a payment, so its
      outcome arrives as `payment.*` events.

    This document is the contract: `ApiContractTest` fails the build if the implementation drifts from it.
servers:
  - url: http://localhost:8080
    description: Local development (`./gradlew bootTestRun`)
security:
  - apiKey: []
tags:
  - name: Payments
  - name: Refunds
  - name: Disputes
    description: Chargebacks and UPI disputes reported by the PSP. Read-only; evidence is submitted on the PSP's dashboard.
  - name: Mandates
    description: UPI AutoPay, card and eNACH mandates, and the recurring debits made on them.
  - name: Checkout
    description: Hosted checkout sessions. The customer-facing pages under `/checkout/` are HTML and not part of this API.

paths:
  /v1/payments:
    post:
      tags: [Payments]
      operationId: createPayment
      summary: Create a payment
      description: Creates a payment in `requires_payment_method`. It expires after `expires_in_seconds` (default 15 minutes) unless confirmed.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePaymentRequest'
            example:
              amount: 49900
              currency: INR
              merchant_order_id: order_1001
              customer: {reference: cust_42, email: buyer@example.com}
      responses:
        '201':
          description: Payment created (or the original response replayed).
          headers:
            Idempotent-Replayed: {$ref: '#/components/headers/IdempotentReplayed'}
            X-Request-Id: {$ref: '#/components/headers/RequestId'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Payment'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        default: {$ref: '#/components/responses/UnexpectedError'}

  /v1/payments/{payment_id}:
    get:
      tags: [Payments]
      operationId: getPayment
      summary: Retrieve a payment
      parameters:
        - $ref: '#/components/parameters/PaymentId'
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: The payment.
          headers:
            X-Request-Id: {$ref: '#/components/headers/RequestId'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Payment'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        default: {$ref: '#/components/responses/UnexpectedError'}

  /v1/payments/{payment_id}/confirm:
    post:
      tags: [Payments]
      operationId: confirmPayment
      summary: Confirm a payment with a payment method
      description: |
        Starts an attempt on a PSP chosen by routing. The response usually has status `requires_action` with a
        `next_action` for the customer (`redirect`, `upi_intent`, `display_qr` or `await_approval`). A payment
        can be confirmed again after an attempt fails, up to the attempt limit.
      parameters:
        - $ref: '#/components/parameters/PaymentId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ConfirmPaymentRequest'}
            example:
              payment_method: {type: upi, upi: {flow: intent}}
              return_url: https://merchant.example/orders/1001
              client: {ip: 203.0.113.7, user_agent: Mozilla/5.0}
      responses:
        '200':
          description: The attempt was started (or the original response replayed).
          headers:
            Idempotent-Replayed: {$ref: '#/components/headers/IdempotentReplayed'}
            X-Request-Id: {$ref: '#/components/headers/RequestId'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Payment'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
        default: {$ref: '#/components/responses/UnexpectedError'}

  /v1/payments/{payment_id}/capture:
    post:
      tags: [Payments]
      operationId: capturePayment
      summary: Capture an authorized payment
      description: >-
        For `capture_method=manual`. Without `amount`, the full authorized amount is captured. A smaller `amount` is
        captured only if the payment's PSP supports partial capture (otherwise `422 unsupported_payment_method`), and the
        PSP releases the rest of the authorization. More than the authorized amount is refused with
        `422 capture_amount_mismatch`. A payment is captured once.
      parameters:
        - $ref: '#/components/parameters/PaymentId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: false
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CapturePaymentRequest'}
      responses:
        '200':
          description: The payment after the capture request.
          headers:
            Idempotent-Replayed: {$ref: '#/components/headers/IdempotentReplayed'}
            X-Request-Id: {$ref: '#/components/headers/RequestId'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Payment'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
        default: {$ref: '#/components/responses/UnexpectedError'}

  /v1/payments/{payment_id}/cancel:
    post:
      tags: [Payments]
      operationId: cancelPayment
      summary: Cancel a payment or void an authorization
      parameters:
        - $ref: '#/components/parameters/PaymentId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: false
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CancelPaymentRequest'}
      responses:
        '200':
          description: The cancelled payment.
          headers:
            Idempotent-Replayed: {$ref: '#/components/headers/IdempotentReplayed'}
            X-Request-Id: {$ref: '#/components/headers/RequestId'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Payment'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        default: {$ref: '#/components/responses/UnexpectedError'}

  /v1/payments/{payment_id}/refunds:
    post:
      tags: [Refunds]
      operationId: createRefund
      summary: Refund a succeeded payment
      description: Omitting `amount` refunds the remaining refundable amount. Several partial refunds are allowed.
      parameters:
        - $ref: '#/components/parameters/PaymentId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: false
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateRefundRequest'}
      responses:
        '201':
          description: Refund created; its status moves asynchronously.
          headers:
            Idempotent-Replayed: {$ref: '#/components/headers/IdempotentReplayed'}
            X-Request-Id: {$ref: '#/components/headers/RequestId'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Refund'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
        default: {$ref: '#/components/responses/UnexpectedError'}
    get:
      tags: [Refunds]
      operationId: listRefunds
      summary: List the refunds of a payment
      parameters:
        - $ref: '#/components/parameters/PaymentId'
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: Refunds, oldest first.
          headers:
            X-Request-Id: {$ref: '#/components/headers/RequestId'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RefundList'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        default: {$ref: '#/components/responses/UnexpectedError'}

  /v1/refunds/{refund_id}:
    get:
      tags: [Refunds]
      operationId: getRefund
      summary: Retrieve a refund
      parameters:
        - name: refund_id
          in: path
          required: true
          schema: {type: string, pattern: '^rfnd_'}
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: The refund.
          headers:
            X-Request-Id: {$ref: '#/components/headers/RequestId'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Refund'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        default: {$ref: '#/components/responses/UnexpectedError'}

  /v1/payments/{payment_id}/disputes:
    get:
      tags: [Disputes]
      operationId: listDisputes
      summary: List the disputes of a payment
      parameters:
        - $ref: '#/components/parameters/PaymentId'
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: Disputes, oldest first.
          headers:
            X-Request-Id: {$ref: '#/components/headers/RequestId'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DisputeList'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        default: {$ref: '#/components/responses/UnexpectedError'}

  /v1/payments/{payment_id}/credits:
    get:
      tags: [Payments]
      operationId: listCredits
      summary: List the bank transfers that arrived for a payment
      description: >-
        Each transfer to the payment's virtual account is a credit. Credits add up to the amount (or must match it
        exactly, per the merchant's settings); what does not pay for the payment goes back to the customer as a refund
        with `initiated_by: system_credit_return`.
      parameters:
        - $ref: '#/components/parameters/PaymentId'
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: Credits, oldest first.
          headers:
            X-Request-Id: {$ref: '#/components/headers/RequestId'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CreditList'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        default: {$ref: '#/components/responses/UnexpectedError'}

  /v1/disputes/{dispute_id}:
    get:
      tags: [Disputes]
      operationId: getDispute
      summary: Retrieve a dispute
      parameters:
        - $ref: '#/components/parameters/DisputeId'
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: The dispute.
          headers:
            X-Request-Id: {$ref: '#/components/headers/RequestId'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Dispute'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        default: {$ref: '#/components/responses/UnexpectedError'}

  /v1/disputes/{dispute_id}/evidence_files:
    post:
      tags: [Disputes]
      operationId: uploadDisputeEvidence
      summary: Upload an evidence file for a dispute
      description: |
        Stores one file, encrypted, for a later contest. PDF, JPEG or PNG, up to 5 MB and 10 files per dispute; the
        type is checked against the file's first bytes. Files are only ever sent on to the PSP, never served back.
        Accepted while the dispute can still be answered (`409 dispute_invalid_state` otherwise), on PSPs that take
        dispute responses (`422 dispute_response_unsupported` otherwise). Bodies on this path may be up to 7 MB.
      parameters:
        - $ref: '#/components/parameters/DisputeId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UploadEvidenceFileRequest'}
            example:
              category: shipping_proof
              file_name: courier-receipt.pdf
              content_type: application/pdf
              content_base64: JVBERi0xLjcKJcfsj6IK
      responses:
        '201':
          description: The stored file (or the original response replayed).
          headers:
            Idempotent-Replayed: {$ref: '#/components/headers/IdempotentReplayed'}
            X-Request-Id: {$ref: '#/components/headers/RequestId'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/EvidenceFile'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        default: {$ref: '#/components/responses/UnexpectedError'}
    get:
      tags: [Disputes]
      operationId: listDisputeEvidence
      summary: List the evidence files uploaded for a dispute
      parameters:
        - $ref: '#/components/parameters/DisputeId'
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: Files, oldest first.
          headers:
            X-Request-Id: {$ref: '#/components/headers/RequestId'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/EvidenceFileList'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        default: {$ref: '#/components/responses/UnexpectedError'}

  /v1/disputes/{dispute_id}/contest:
    post:
      tags: [Disputes]
      operationId: contestDispute
      summary: Contest a dispute with evidence
      description: |
        Sends the statement and the chosen evidence files to the PSP, which then reviews the dispute. One response
        per dispute, while it is `open` and before `respond_by` (`409 dispute_invalid_state` otherwise); a response
        that `failed` can be replaced. `200` when the PSP took it at once; `202` while the gateway is still
        delivering it (it retries until `respond_by`; follow `response.status`, or the `dispute.updated` and
        `dispute.response_failed` events).
      parameters:
        - $ref: '#/components/parameters/DisputeId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ContestDisputeRequest'}
            example:
              statement: The order was delivered on 2 October; the signed courier receipt is attached.
              evidence_file_ids: [dsf_01K5Z9V4J6Q2X8N3M7B1C0D4E5]
      responses:
        '200':
          description: The PSP took the contest.
          headers:
            Idempotent-Replayed: {$ref: '#/components/headers/IdempotentReplayed'}
            X-Request-Id: {$ref: '#/components/headers/RequestId'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Dispute'}
        '202':
          description: Recorded; delivery to the PSP continues (`response.status` is `pending`), or it already failed.
          headers:
            Idempotent-Replayed: {$ref: '#/components/headers/IdempotentReplayed'}
            X-Request-Id: {$ref: '#/components/headers/RequestId'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Dispute'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        default: {$ref: '#/components/responses/UnexpectedError'}

  /v1/disputes/{dispute_id}/accept:
    post:
      tags: [Disputes]
      operationId: acceptDispute
      summary: Accept a dispute
      description: |
        Tells the PSP you will not contest; the dispute becomes `lost`. This cannot be undone. The disputed amount was
        withheld when the dispute opened and stays with the customer. Same rules and status codes as a contest.
      parameters:
        - $ref: '#/components/parameters/DisputeId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: The PSP took the acceptance.
          headers:
            Idempotent-Replayed: {$ref: '#/components/headers/IdempotentReplayed'}
            X-Request-Id: {$ref: '#/components/headers/RequestId'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Dispute'}
        '202':
          description: Recorded; delivery to the PSP continues (`response.status` is `pending`), or it already failed.
          headers:
            Idempotent-Replayed: {$ref: '#/components/headers/IdempotentReplayed'}
            X-Request-Id: {$ref: '#/components/headers/RequestId'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Dispute'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        default: {$ref: '#/components/responses/UnexpectedError'}

  /v1/mandates:
    post:
      tags: [Mandates]
      operationId: createMandate
      summary: Register a mandate
      description: |
        Registers the mandate at the first linked PSP that supports the instrument and `max_amount`. The response
        is usually `pending_authorization` with a `next_action` (`redirect`) where the customer approves it within
        24 hours. UPI and card registrations charge ₹1 through the payment in `registration_payment_id`. The
        outcome arrives as `mandate.activated` or `mandate.failed`.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateMandateRequest'}
            example:
              instrument: upi_autopay
              max_amount: 500000
              currency: INR
              frequency: monthly
              description: Gym membership
              customer: {reference: cust_42, name: Asha Rao, email: asha@example.com, phone: '+919999999999'}
              return_url: https://merchant.example/subscriptions/42
      responses:
        '201':
          description: Mandate created (or the original response replayed).
          headers:
            Idempotent-Replayed: {$ref: '#/components/headers/IdempotentReplayed'}
            X-Request-Id: {$ref: '#/components/headers/RequestId'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Mandate'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
        default: {$ref: '#/components/responses/UnexpectedError'}

  /v1/mandates/{mandate_id}:
    get:
      tags: [Mandates]
      operationId: getMandate
      summary: Retrieve a mandate
      parameters:
        - $ref: '#/components/parameters/MandateId'
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: The mandate.
          headers:
            X-Request-Id: {$ref: '#/components/headers/RequestId'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Mandate'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        default: {$ref: '#/components/responses/UnexpectedError'}

  /v1/mandates/{mandate_id}/revoke:
    post:
      tags: [Mandates]
      operationId: revokeMandate
      summary: Revoke a mandate
      description: |
        Revokes the mandate at the PSP, then here, and cancels its debits that have not started executing. A revoked
        mandate replays as success. `409 mandate_invalid_state` once it has expired or failed; `503` when the PSP
        could not confirm the revocation (retry with the same Idempotency-Key).
      parameters:
        - $ref: '#/components/parameters/MandateId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: The revoked mandate.
          headers:
            Idempotent-Replayed: {$ref: '#/components/headers/IdempotentReplayed'}
            X-Request-Id: {$ref: '#/components/headers/RequestId'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Mandate'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
        default: {$ref: '#/components/responses/UnexpectedError'}

  /v1/mandates/{mandate_id}/debits:
    post:
      tags: [Mandates]
      operationId: createMandateDebit
      summary: Debit an active mandate
      description: |
        Schedules a debit. For UPI AutoPay and card mandates the PSP notifies the customer, and the debit runs at
        least 24 hours after delivery and no earlier than `due_at`. A failed debit is retried up to 3 times, a day
        apart. The money moves on the debit's payment (`payment_id`): follow its `payment.*` events. A mandate has
        one debit in progress at a time. UPI and card debits above ₹15,000 (or your account's limit) need the
        customer's authentication, so collect them as payments instead.
      parameters:
        - $ref: '#/components/parameters/MandateId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateMandateDebitRequest'}
            example:
              amount: 99900
              merchant_debit_id: invoice_2026_10
              description: October membership
      responses:
        '201':
          description: Debit scheduled (or the original response replayed).
          headers:
            Idempotent-Replayed: {$ref: '#/components/headers/IdempotentReplayed'}
            X-Request-Id: {$ref: '#/components/headers/RequestId'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MandateDebit'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        default: {$ref: '#/components/responses/UnexpectedError'}
    get:
      tags: [Mandates]
      operationId: listMandateDebits
      summary: List the debits of a mandate
      parameters:
        - $ref: '#/components/parameters/MandateId'
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: Debits, oldest first.
          headers:
            X-Request-Id: {$ref: '#/components/headers/RequestId'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MandateDebitList'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        default: {$ref: '#/components/responses/UnexpectedError'}

  /v1/mandates/{mandate_id}/debits/{debit_id}:
    get:
      tags: [Mandates]
      operationId: getMandateDebit
      summary: Retrieve a debit
      parameters:
        - $ref: '#/components/parameters/MandateId'
        - $ref: '#/components/parameters/DebitId'
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: The debit.
          headers:
            X-Request-Id: {$ref: '#/components/headers/RequestId'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MandateDebit'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        default: {$ref: '#/components/responses/UnexpectedError'}

  /v1/mandates/{mandate_id}/debits/{debit_id}/cancel:
    post:
      tags: [Mandates]
      operationId: cancelMandateDebit
      summary: Cancel a debit
      description: |
        Cancels a debit that has not started executing (`scheduled`, `notifying` or `ready`), and its payment. A
        cancelled debit replays as success; any other status is `409 mandate_invalid_state`.
      parameters:
        - $ref: '#/components/parameters/MandateId'
        - $ref: '#/components/parameters/DebitId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: The cancelled debit.
          headers:
            Idempotent-Replayed: {$ref: '#/components/headers/IdempotentReplayed'}
            X-Request-Id: {$ref: '#/components/headers/RequestId'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MandateDebit'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        default: {$ref: '#/components/responses/UnexpectedError'}

  /v1/checkout-sessions:
    post:
      tags: [Checkout]
      operationId: createCheckoutSession
      summary: Create a hosted checkout session for a payment
      description: |
        Redirect the customer to `url`. The page lets them choose UPI (app, UPI ID or QR code), card, netbanking, a
        wallet, card EMI, cardless EMI or pay later, whichever can be routed for the payment; card details are entered
        only on the PSP's own page. The URL is a bearer credential for this one payment, so
        send it only to the paying customer. It stops working at `expires_at`.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateCheckoutSessionRequest'}
            example:
              payment_id: pay_01K5Z9V4J6Q2X8N3M7B1C0D4E5
              return_url: https://merchant.example/orders/1001
      responses:
        '201':
          description: Session created (or the original response replayed).
          headers:
            Idempotent-Replayed: {$ref: '#/components/headers/IdempotentReplayed'}
            X-Request-Id: {$ref: '#/components/headers/RequestId'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CheckoutSession'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        default: {$ref: '#/components/responses/UnexpectedError'}

webhooks:
  merchantEvent:
    post:
      summary: Payment, refund, dispute and mandate events sent to the merchant's webhook URL
      description: |
        Delivered at least once, possibly out of order; deduplicate on `id` (also in `PG-Event-Id`) and re-read
        the resource if ordering matters. Verify `PG-Signature: t=<unix seconds>,v1=<hex>` where
        `v1 = HMAC-SHA256(webhook_secret, t + "." + raw_body)`, and reject timestamps older than 5 minutes.
        While a webhook secret is being rotated the header carries one `v1` per valid secret: accept the delivery
        if any of them matches.
        Any 2xx acknowledges; otherwise delivery is retried with backoff for about 47 hours.
      security: []
      parameters:
        - {name: PG-Signature, in: header, required: true, schema: {type: string}}
        - {name: PG-Event-Id, in: header, required: true, schema: {type: string}}
        - {name: PG-Event-Type, in: header, required: true, schema: {$ref: '#/components/schemas/EventType'}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/Event'}
      responses:
        '200':
          description: Acknowledged (any 2xx).

components:
  securitySchemes:
    apiKey:
      type: http
      scheme: bearer
      description: Secret API key (`sk_...`), issued per merchant.

  parameters:
    PaymentId:
      name: payment_id
      in: path
      required: true
      schema: {type: string, pattern: '^pay_'}
    MandateId:
      name: mandate_id
      in: path
      required: true
      schema: {type: string, pattern: '^mdt_'}
    DebitId:
      name: debit_id
      in: path
      required: true
      schema: {type: string, pattern: '^mdd_'}
    DisputeId:
      name: dispute_id
      in: path
      required: true
      schema: {type: string, pattern: '^dsp_'}
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Unique per logical operation; reuse it only to retry the same request.
      schema: {type: string, minLength: 1, maxLength: 255, pattern: '^[\x21-\x7E]+$'}
    RequestId:
      name: X-Request-Id
      in: header
      required: false
      description: Optional correlation id (1-64 of `A-Za-z0-9._-`); generated when absent and echoed back.
      schema: {type: string, pattern: '^[A-Za-z0-9._-]{1,64}$'}

  headers:
    RequestId:
      required: true
      description: Correlation id of this request; quote it when contacting support.
      schema: {type: string}
    IdempotentReplayed:
      required: true
      description: '`true` when this is the stored response of an earlier request with the same key.'
      schema: {type: string, enum: ['true', 'false']}
    RetryAfter:
      description: Seconds to wait before retrying.
      schema: {type: integer, minimum: 1}
    RetryAfterRequired:
      required: true
      description: Seconds to wait before retrying.
      schema: {type: integer, minimum: 1}

  responses:
    BadRequest:
      description: '`validation_error` (see `errors`), `malformed_request` or `idempotency_key_required`.'
      headers:
        X-Request-Id: {$ref: '#/components/headers/RequestId'}
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    Unauthorized:
      description: '`authentication_required` or `invalid_api_key`.'
      headers:
        X-Request-Id: {$ref: '#/components/headers/RequestId'}
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    NotFound:
      description: '`resource_not_found`: unknown id, or it belongs to another merchant.'
      headers:
        X-Request-Id: {$ref: '#/components/headers/RequestId'}
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    Conflict:
      description: |
        `payment_invalid_state` (re-read the resource), `refund_already_exists`, `mandate_invalid_state`,
        `mandate_debit_already_exists`, `dispute_invalid_state`, or `idempotency_request_in_progress` (retry with the
        same key after `Retry-After`).
      headers:
        X-Request-Id: {$ref: '#/components/headers/RequestId'}
        Retry-After: {$ref: '#/components/headers/RetryAfter'}
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    Unprocessable:
      description: |
        `idempotency_key_reuse`, `amount_exceeds_refundable`, `amount_exceeds_mandate_limit`,
        `capture_amount_mismatch`, `unsupported_payment_method`, `unsupported_currency` or
        `dispute_response_unsupported`. Do not retry unchanged.
      headers:
        X-Request-Id: {$ref: '#/components/headers/RequestId'}
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    PayloadTooLarge:
      description: '`payload_too_large`: the body is over the limit for this path.'
      headers:
        X-Request-Id: {$ref: '#/components/headers/RequestId'}
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    TooManyRequests:
      description: '`rate_limited`. Not processed and the Idempotency-Key was not consumed: retry after `Retry-After`.'
      headers:
        X-Request-Id: {$ref: '#/components/headers/RequestId'}
        Retry-After: {$ref: '#/components/headers/RetryAfterRequired'}
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    ServiceUnavailable:
      description: '`no_provider_available`: retry with the same Idempotency-Key and backoff.'
      headers:
        X-Request-Id: {$ref: '#/components/headers/RequestId'}
        Retry-After: {$ref: '#/components/headers/RetryAfter'}
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    UnexpectedError:
      description: '`internal_error`: retry with the same Idempotency-Key and backoff.'
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}

  schemas:
    Amount:
      type: integer
      format: int64
      description: Minor units of `currency` (paise for INR).
    Timestamp:
      type: string
      format: date-time
    Currency:
      type: string
      pattern: '^[A-Z]{3}$'
      examples: [INR]

    PaymentStatus:
      type: string
      enum: [requires_payment_method, processing, requires_action, authorized, succeeded, failed, cancelled, expired]
      description: |
        `authorized` is only used with `capture_method=manual`. Final: `succeeded`, `failed`, `cancelled`, `expired`
        (a late PSP success on a failed or expired payment is refunded or accepted per merchant policy).
    AttemptStatus:
      type: string
      enum: [initiated, unknown, requires_action, pending, authorized, capture_pending, succeeded, failed, voided]
    RefundStatus:
      type: string
      enum: [initiated, unknown, pending, succeeded, failed]
    DisputeStatus:
      type: string
      enum: [open, under_review, won, lost]
      description: Final statuses are `won` (the withheld amount is returned) and `lost`.
    FailureCategory:
      type: string
      enum: [customer, issuer, provider, provider_unavailable, validation, risk, timeout, not_submitted]
    EventType:
      type: string
      enum: [payment.authorized, payment.succeeded, payment.attempt_failed, payment.failed, payment.cancelled,
             payment.expired, refund.succeeded, refund.failed, dispute.created, dispute.updated, dispute.won,
             dispute.lost, dispute.evidence_due, dispute.response_failed, mandate.activated, mandate.paused,
             mandate.resumed, mandate.revoked, mandate.expired, mandate.failed]
      description: |
        `dispute.evidence_due`: the dispute's `respond_by` is 3 days away (or less) and it has not been answered.
        `dispute.response_failed`: the PSP refused your contest or acceptance, or it could not be delivered in time.
    MandateStatus:
      type: string
      enum: [created, pending_authorization, active, paused, revoked, expired, failed]
      description: |
        Only `active` mandates can be debited. `paused` and `active` alternate as the customer pauses and resumes in
        their UPI or bank app. Final: `revoked`, `expired` (at `end_at`) and `failed` (never authorized).
    MandateDebitStatus:
      type: string
      enum: [scheduled, notifying, ready, executing, succeeded, failed, cancelled]
      description: |
        UPI and card debits go `scheduled` → `notifying` → `ready` → `executing`; eNACH debits start `ready`.
        A failed attempt with retries left starts the next cycle. Final: `succeeded`, `failed` and `cancelled`.
    MandateInstrument:
      type: string
      enum: [upi_autopay, card, enach]
    MandateFrequency:
      type: string
      enum: [daily, weekly, fortnightly, monthly, bimonthly, quarterly, half_yearly, yearly, as_presented]
      description: Passed to the PSP, which enforces it.

    Payment:
      type: object
      required: [id, object, merchant_order_id, amount, currency, status, capture_method, amount_captured,
                 amount_refunded, attempt_count, expires_at, created_at, updated_at, version]
      properties:
        id: {type: string, pattern: '^pay_'}
        object: {const: payment}
        merchant_order_id: {type: string}
        amount: {$ref: '#/components/schemas/Amount'}
        currency: {$ref: '#/components/schemas/Currency'}
        status: {$ref: '#/components/schemas/PaymentStatus'}
        capture_method: {type: string, enum: [automatic, manual]}
        description: {type: string}
        customer: {$ref: '#/components/schemas/Customer'}
        metadata:
          type: object
          additionalProperties: {type: string}
        amount_captured:
          $ref: '#/components/schemas/Amount'
          description: Below `amount` after a partial capture; the PSP released the difference.
        amount_refunded: {$ref: '#/components/schemas/Amount'}
        next_action: {$ref: '#/components/schemas/NextAction'}
        latest_attempt: {$ref: '#/components/schemas/Attempt'}
        attempt_count: {type: integer, minimum: 0}
        last_error: {$ref: '#/components/schemas/PaymentError'}
        cancellation_reason: {type: string}
        expires_at:
          $ref: '#/components/schemas/Timestamp'
          description: When an unconfirmed payment expires.
        authorization_expires_at:
          $ref: '#/components/schemas/Timestamp'
          description: When an uncaptured authorization is voided.
        created_at: {$ref: '#/components/schemas/Timestamp'}
        updated_at: {$ref: '#/components/schemas/Timestamp'}
        version: {type: integer, format: int64, description: Increases with every change.}
        mandate_id:
          type: string
          pattern: '^mdt_'
          description: Set on a mandate's debits and its authorization charge, which only the gateway confirms or cancels.
    Customer:
      type: object
      properties:
        reference: {type: string}
        email: {type: string}
        phone: {type: string}
    NextAction:
      type: object
      description: Present only while the payment is `requires_action`.
      required: [type]
      properties:
        type: {type: string, enum: [redirect, upi_intent, display_qr, await_approval, bank_transfer]}
        url: {type: string, description: '`redirect`: send the customer to this URL (a PSP-hosted page).'}
        upi_uri: {type: string, description: '`upi_intent`: open this `upi://` URI on the customer''s phone.'}
        qr_payload: {type: string, description: '`display_qr`: render this as a QR code.'}
        expires_at: {$ref: '#/components/schemas/Timestamp'}
        bank_transfer:
          type: object
          description: >-
            `bank_transfer`: the virtual account issued for this payment. The customer sends the amount by NEFT,
            RTGS or IMPS, or by UPI to `vpa` where present, before `expires_at`.
          required: [account_number, ifsc]
          properties:
            account_number: {type: string}
            ifsc: {type: string, pattern: '^[A-Z]{4}0[A-Z0-9]{6}$'}
            beneficiary_name: {type: string}
            bank_name: {type: string}
            vpa: {type: string}
      allOf:
        - if: {properties: {type: {const: bank_transfer}}}
          then: {required: [bank_transfer]}
    Attempt:
      type: object
      required: [id, attempt_number, status, method, provider, created_at]
      properties:
        id: {type: string, pattern: '^att_'}
        attempt_number: {type: integer, minimum: 1}
        status: {$ref: '#/components/schemas/AttemptStatus'}
        method: {type: string, enum: [upi, card, netbanking, mandate, wallet, emi, cardless_emi, pay_later, bank_transfer]}
        upi_flow: {type: string, enum: [intent, qr, collect]}
        bank_code: {type: string}
        method_provider: {type: string, description: 'The wallet or lender, for `wallet`, `cardless_emi` and `pay_later`.'}
        card:
          type: object
          description: Card network and last 4 digits, once the customer has paid by card on the PSP's page. Nothing else about the card is ever stored.
          required: [network, last4]
          properties:
            network: {type: string, examples: [visa, mastercard, rupay]}
            last4: {type: string, pattern: '^[0-9]{4}$'}
        emi_plan:
          type: object
          description: The card EMI plan the customer chose on the PSP's page, as the PSP reported it with the card.
          required: [tenure_months]
          properties:
            tenure_months: {type: integer, minimum: 1, maximum: 120}
            interest_rate_bps: {type: integer, minimum: 0, maximum: 10000, description: Annual rate in basis points.}
            issuer: {type: string, pattern: '^[A-Z0-9_]{2,16}$', description: The issuing bank's code.}
        provider: {type: string}
        provider_reference: {type: string}
        failure: {$ref: '#/components/schemas/PaymentError'}
        created_at: {$ref: '#/components/schemas/Timestamp'}
    PaymentError:
      type: object
      required: [code]
      properties:
        code: {type: string}
        category: {$ref: '#/components/schemas/FailureCategory'}
        message: {type: string}

    Refund:
      type: object
      required: [id, object, payment_id, attempt_id, amount, currency, status, initiated_by, provider, created_at,
                 updated_at, version]
      properties:
        id: {type: string, pattern: '^rfnd_'}
        object: {const: refund}
        payment_id: {type: string, pattern: '^pay_'}
        attempt_id: {type: string, pattern: '^att_'}
        amount: {$ref: '#/components/schemas/Amount'}
        currency: {$ref: '#/components/schemas/Currency'}
        status: {$ref: '#/components/schemas/RefundStatus'}
        reason: {type: string}
        merchant_refund_id: {type: string}
        initiated_by:
          type: string
          enum: [merchant, system_late_success, system_duplicate_success, system_credit_return]
          description: >-
            System refunds return money from late or duplicate successes, and bank transfer credits that did not pay
            for the payment (`system_credit_return`, with `reason` `excess`, `inexact`, `late` or `short_at_expiry`).
            Credit returns are not part of the payment's `amount_refunded`.
        credit_id: {type: string, pattern: '^trc_', description: The bank transfer credit the refund sends money back from.}
        provider: {type: string}
        provider_reference: {type: string}
        failure: {$ref: '#/components/schemas/PaymentError'}
        created_at: {$ref: '#/components/schemas/Timestamp'}
        updated_at: {$ref: '#/components/schemas/Timestamp'}
        version: {type: integer, format: int64}
    RefundList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: {$ref: '#/components/schemas/Refund'}

    Credit:
      type: object
      description: A bank transfer that arrived in the payment's virtual account.
      required: [id, object, payment_id, amount, currency, received_at, applied_amount, returned_amount]
      properties:
        id: {type: string, pattern: '^trc_'}
        object: {const: credit}
        payment_id: {type: string, pattern: '^pay_'}
        amount: {$ref: '#/components/schemas/Amount'}
        currency: {$ref: '#/components/schemas/Currency'}
        mode: {type: string, enum: [neft, rtgs, imps, upi], description: Absent when the PSP did not report it.}
        utr: {type: string, description: The bank's reference for the transfer.}
        received_at: {$ref: '#/components/schemas/Timestamp'}
        applied_amount: {type: integer, format: int64, minimum: 0, description: The part that pays the payment.}
        returned_amount: {type: integer, format: int64, minimum: 0, description: The part sent back to the customer.}
        return_id: {type: string, pattern: '^rfnd_', description: The refund sending `returned_amount` back.}
    CreditList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: {$ref: '#/components/schemas/Credit'}

    Dispute:
      type: object
      description: |
        A chargeback or UPI dispute on a succeeded payment. Until it is won, the PSP withholds `amount` from your
        settlements and it cannot also be refunded. Answer it before `respond_by`: through this API (contest or
        accept) where the PSP supports it, otherwise on the PSP's dashboard.
      required: [id, object, payment_id, attempt_id, amount, currency, status, provider, provider_reference,
                 created_at, updated_at, version]
      properties:
        id: {type: string, pattern: '^dsp_'}
        object: {const: dispute}
        payment_id: {type: string, pattern: '^pay_'}
        attempt_id: {type: string, pattern: '^att_'}
        amount: {$ref: '#/components/schemas/Amount'}
        currency: {$ref: '#/components/schemas/Currency'}
        status: {$ref: '#/components/schemas/DisputeStatus'}
        reason: {type: string, description: 'As reported by the PSP, e.g. `fraudulent`, `product_not_received`.'}
        provider: {type: string}
        provider_reference: {type: string, description: The PSP's dispute id.}
        respond_by: {$ref: '#/components/schemas/Timestamp'}
        response: {$ref: '#/components/schemas/DisputeAnswer'}
        created_at: {$ref: '#/components/schemas/Timestamp'}
        updated_at: {$ref: '#/components/schemas/Timestamp'}
        version: {type: integer, format: int64}
    DisputeAnswer:
      type: object
      description: Your contest or acceptance, and its delivery to the PSP. Absent until you answer.
      required: [type, status, requested_at]
      properties:
        type: {type: string, enum: [contest, accept]}
        status:
          type: string
          enum: [pending, sent, failed]
          description: |
            `pending`: being delivered (retried until `respond_by`). `sent`: the PSP has it. `failed`: refused by
            the PSP or not delivered in time (`failure_reason`); you may answer again while the dispute is open.
        statement: {type: string, maxLength: 1000}
        evidence_file_ids:
          type: array
          items: {type: string, pattern: '^dsf_'}
        requested_at: {$ref: '#/components/schemas/Timestamp'}
        sent_at: {$ref: '#/components/schemas/Timestamp'}
        failure_reason: {type: string, examples: [evidence_rejected, deadline_passed, dispute_already_lost]}
    EvidenceCategory:
      type: string
      enum: [shipping_proof, billing_proof, cancellation_proof, customer_communication, proof_of_service,
             explanation_letter, refund_confirmation, access_activity_log, refund_cancellation_policy,
             terms_and_conditions, other]
    EvidenceFile:
      type: object
      required: [id, object, dispute_id, category, file_name, content_type, size, sha256, created_at]
      properties:
        id: {type: string, pattern: '^dsf_'}
        object: {const: dispute_evidence_file}
        dispute_id: {type: string, pattern: '^dsp_'}
        category: {$ref: '#/components/schemas/EvidenceCategory'}
        file_name: {type: string}
        content_type: {type: string, enum: [application/pdf, image/jpeg, image/png]}
        size: {type: integer, description: Bytes.}
        sha256: {type: string, pattern: '^[0-9a-f]{64}$', description: SHA-256 of the file as uploaded.}
        created_at: {$ref: '#/components/schemas/Timestamp'}
    EvidenceFileList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: {$ref: '#/components/schemas/EvidenceFile'}
    UploadEvidenceFileRequest:
      type: object
      required: [category, file_name, content_type, content_base64]
      properties:
        category: {$ref: '#/components/schemas/EvidenceCategory'}
        file_name: {type: string, minLength: 1, maxLength: 255, description: 'No path separators or control characters.'}
        content_type: {type: string, enum: [application/pdf, image/jpeg, image/png]}
        content_base64: {type: string, contentEncoding: base64, description: The file, base64-encoded (up to 5 MB decoded).}
    ContestDisputeRequest:
      type: object
      required: [statement, evidence_file_ids]
      properties:
        statement: {type: string, minLength: 1, maxLength: 1000}
        evidence_file_ids:
          type: array
          minItems: 1
          maxItems: 10
          uniqueItems: true
          items: {type: string, pattern: '^dsf_'}
    DisputeList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: {$ref: '#/components/schemas/Dispute'}

    Mandate:
      type: object
      required: [id, object, status, instrument, provider, max_amount, currency, frequency, start_at, end_at,
                 customer, created_at, updated_at, version]
      properties:
        id: {type: string, pattern: '^mdt_'}
        object: {const: mandate}
        status: {$ref: '#/components/schemas/MandateStatus'}
        instrument: {$ref: '#/components/schemas/MandateInstrument'}
        provider: {type: string}
        max_amount:
          $ref: '#/components/schemas/Amount'
          description: The largest single debit.
        currency: {$ref: '#/components/schemas/Currency'}
        frequency: {$ref: '#/components/schemas/MandateFrequency'}
        start_at: {$ref: '#/components/schemas/Timestamp'}
        end_at: {$ref: '#/components/schemas/Timestamp'}
        description: {type: string}
        customer: {$ref: '#/components/schemas/MandateCustomer'}
        metadata:
          type: object
          additionalProperties: {type: string}
        next_action:
          $ref: '#/components/schemas/NextAction'
          description: Present only while `pending_authorization`; send the customer there to approve the mandate.
        registration_payment_id:
          type: string
          pattern: '^pay_'
          description: The ₹1 authorization charge of UPI and card mandates.
        last_error: {$ref: '#/components/schemas/PaymentError'}
        activated_at: {$ref: '#/components/schemas/Timestamp'}
        created_at: {$ref: '#/components/schemas/Timestamp'}
        updated_at: {$ref: '#/components/schemas/Timestamp'}
        version: {type: integer, format: int64}
    MandateCustomer:
      type: object
      required: [email, phone]
      properties:
        reference: {type: string}
        name: {type: string}
        email: {type: string}
        phone: {type: string}
    MandateDebit:
      type: object
      description: One debit of a mandate. Its payment carries the money and the outcome.
      required: [id, object, mandate_id, payment_id, merchant_debit_id, amount, currency, status, due_at, not_before,
                 cycle, created_at, updated_at, version]
      properties:
        id: {type: string, pattern: '^mdd_'}
        object: {const: mandate_debit}
        mandate_id: {type: string, pattern: '^mdt_'}
        payment_id: {type: string, pattern: '^pay_'}
        merchant_debit_id: {type: string}
        amount: {$ref: '#/components/schemas/Amount'}
        currency: {$ref: '#/components/schemas/Currency'}
        status: {$ref: '#/components/schemas/MandateDebitStatus'}
        description: {type: string}
        due_at: {$ref: '#/components/schemas/Timestamp'}
        not_before:
          $ref: '#/components/schemas/Timestamp'
          description: Earliest execution of the current cycle.
        cycle: {type: integer, minimum: 1, description: '1 for the first attempt, then one more per retry.'}
        notified_at:
          $ref: '#/components/schemas/Timestamp'
          description: When the PSP delivered the current cycle's pre-debit notification.
        last_error: {$ref: '#/components/schemas/PaymentError'}
        created_at: {$ref: '#/components/schemas/Timestamp'}
        updated_at: {$ref: '#/components/schemas/Timestamp'}
        version: {type: integer, format: int64}
    MandateDebitList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: {$ref: '#/components/schemas/MandateDebit'}

    CheckoutSession:
      type: object
      required: [id, object, payment_id, url, expires_at, created_at]
      properties:
        id: {type: string, pattern: '^cs_'}
        object: {const: checkout_session}
        payment_id: {type: string, pattern: '^pay_'}
        url: {type: string, description: Hosted page for the customer. Only returned when the session is created.}
        return_url: {type: string}
        expires_at: {$ref: '#/components/schemas/Timestamp'}
        created_at: {$ref: '#/components/schemas/Timestamp'}

    Event:
      type: object
      required: [id, type, created_at, data]
      properties:
        id: {type: string, pattern: '^evt_'}
        type: {$ref: '#/components/schemas/EventType'}
        created_at: {$ref: '#/components/schemas/Timestamp'}
        data:
          type: object
          required: [object]
          properties:
            object:
              description: |
                The payment (`payment.*`), refund (`refund.*`), dispute (`dispute.*`) or mandate (`mandate.*`) as
                returned by the API.
              oneOf:
                - $ref: '#/components/schemas/Payment'
                - $ref: '#/components/schemas/Refund'
                - $ref: '#/components/schemas/Dispute'
                - $ref: '#/components/schemas/Mandate'

    Problem:
      type: object
      required: [title, status, code]
      properties:
        type: {type: string}
        title: {type: string}
        status: {type: integer}
        detail: {type: string}
        instance: {type: string}
        code:
          type: string
          enum: [validation_error, malformed_request, idempotency_key_required, authentication_required,
                 invalid_api_key, invalid_signature, resource_not_found, method_not_allowed, payload_too_large,
                 unsupported_media_type, payment_invalid_state, refund_already_exists, mandate_invalid_state,
                 mandate_debit_already_exists, dispute_invalid_state, idempotency_request_in_progress,
                 idempotency_key_reuse, amount_exceeds_refundable, amount_exceeds_mandate_limit,
                 capture_amount_mismatch, unsupported_payment_method, unsupported_currency,
                 dispute_response_unsupported, rate_limited, no_provider_available, internal_error]
        request_id: {type: string}
        errors:
          type: array
          items:
            type: object
            required: [field, message]
            properties:
              field: {type: string}
              message: {type: string}

    CreatePaymentRequest:
      type: object
      required: [amount, currency, merchant_order_id]
      properties:
        amount: {type: integer, format: int64, minimum: 100, maximum: 100000000}
        currency: {$ref: '#/components/schemas/Currency'}
        merchant_order_id: {type: string, maxLength: 64, pattern: '^[A-Za-z0-9_\-:.]+$'}
        capture_method: {type: string, enum: [automatic, manual], default: automatic}
        description: {type: string, maxLength: 255}
        customer:
          type: object
          properties:
            reference: {type: string, maxLength: 64}
            email: {type: string, format: email, maxLength: 254}
            phone: {type: string, pattern: '^\+?[0-9]{8,15}$'}
        metadata:
          type: object
          maxProperties: 20
          propertyNames: {minLength: 1, maxLength: 40}
          additionalProperties: {type: string, maxLength: 500}
        expires_in_seconds: {type: integer, minimum: 60, maximum: 86400}
    ConfirmPaymentRequest:
      type: object
      required: [payment_method]
      properties:
        payment_method: {$ref: '#/components/schemas/PaymentMethodInput'}
        return_url:
          type: string
          maxLength: 2048
          pattern: '^https?://\S+$'
          description: Where the PSP page sends the customer back after `redirect` actions.
        client:
          type: object
          description: The customer's device, used by risk checks.
          properties:
            ip: {type: string, maxLength: 45}
            user_agent: {type: string, maxLength: 512}
            device_id: {type: string, maxLength: 128}
    PaymentMethodInput:
      type: object
      required: [type]
      description: >-
        Card details are never sent here; card and card EMI payments redirect to the PSP's page, where the customer
        also picks the EMI plan. Wallets, cardless EMI and pay later name their provider by the code the PSPs use.
        A bank transfer gets a virtual account to pay into (`next_action.bank_transfer`).
      properties:
        type: {type: string, enum: [upi, card, netbanking, wallet, emi, cardless_emi, pay_later, bank_transfer]}
        upi:
          type: object
          required: [flow]
          properties:
            flow: {type: string, enum: [intent, qr, collect]}
            vpa: {type: string, maxLength: 255, description: Required for `collect`.}
        netbanking:
          type: object
          required: [bank_code]
          properties:
            bank_code: {type: string, pattern: '^[A-Z0-9_]{2,16}$'}
        wallet: {$ref: '#/components/schemas/MethodProvider'}
        cardless_emi: {$ref: '#/components/schemas/MethodProvider'}
        pay_later: {$ref: '#/components/schemas/MethodProvider'}
      allOf:
        - if: {properties: {type: {const: upi}}}
          then: {required: [upi]}
        - if: {properties: {type: {const: netbanking}}}
          then: {required: [netbanking]}
        - if: {properties: {type: {const: wallet}}}
          then: {required: [wallet]}
        - if: {properties: {type: {const: cardless_emi}}}
          then: {required: [cardless_emi]}
        - if: {properties: {type: {const: pay_later}}}
          then: {required: [pay_later]}
    MethodProvider:
      type: object
      required: [provider]
      properties:
        provider: {type: string, pattern: '^[a-z0-9_]{2,32}$', examples: [phonepe, zestmoney, lazypay]}
    CapturePaymentRequest:
      type: object
      properties:
        amount: {type: integer, format: int64, minimum: 1, description: 'At most the authorized amount; defaults to it.'}
    CancelPaymentRequest:
      type: object
      properties:
        reason: {type: string, enum: [requested_by_customer, abandoned, duplicate, fraudulent, other]}
    CreateRefundRequest:
      type: object
      properties:
        amount: {type: integer, format: int64, minimum: 1, description: Defaults to the remaining refundable amount.}
        reason: {type: string, maxLength: 255}
        merchant_refund_id: {type: string, maxLength: 64, pattern: '^[A-Za-z0-9_\-:.]+$'}
    CreateMandateRequest:
      type: object
      required: [instrument, max_amount, currency, frequency, customer]
      properties:
        instrument: {$ref: '#/components/schemas/MandateInstrument'}
        max_amount:
          type: integer
          format: int64
          minimum: 100
          maximum: 1000000000
          description: The largest single debit; the PSP's limit for the instrument applies.
        currency: {$ref: '#/components/schemas/Currency'}
        frequency: {$ref: '#/components/schemas/MandateFrequency'}
        start_at:
          $ref: '#/components/schemas/Timestamp'
          description: Defaults to now.
        end_at:
          $ref: '#/components/schemas/Timestamp'
          description: Defaults to 10 years after `start_at`.
        description: {type: string, maxLength: 255}
        customer:
          type: object
          required: [email, phone]
          properties:
            reference: {type: string, maxLength: 64}
            name: {type: string, maxLength: 100}
            email: {type: string, format: email, maxLength: 254}
            phone: {type: string, pattern: '^\+?[0-9]{8,15}$'}
        metadata:
          type: object
          maxProperties: 20
          propertyNames: {minLength: 1, maxLength: 40}
          additionalProperties: {type: string, maxLength: 500}
        return_url:
          type: string
          maxLength: 2048
          pattern: '^https?://\S+$'
          description: Where the PSP's authorization page sends the customer back.
    CreateMandateDebitRequest:
      type: object
      required: [amount, merchant_debit_id]
      properties:
        amount: {type: integer, format: int64, minimum: 100, maximum: 1000000000}
        merchant_debit_id:
          type: string
          maxLength: 64
          pattern: '^[A-Za-z0-9_\-:.]+$'
          description: Your reference, unique per mandate; also the payment's `merchant_order_id`.
        due_at:
          $ref: '#/components/schemas/Timestamp'
          description: 'Earliest debit. Default: 25 hours from now for UPI and card (after the notice), now for eNACH.'
        description: {type: string, maxLength: 255}
    CreateCheckoutSessionRequest:
      type: object
      required: [payment_id]
      properties:
        payment_id: {type: string, pattern: '^pay_'}
        return_url:
          type: string
          maxLength: 2048
          pattern: '^https?://\S+$'
          description: Shown as "Return to merchant" once the payment is final.
