spring:
  application:
    name: payment-gateway
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/payments}
    username: ${DB_USER:payments}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:20}
      connection-timeout: 3000
      validation-timeout: 1000
  flyway:
    enabled: ${DB_MIGRATE_ON_START:true}
    locations: classpath:db/migration
    # Migrations run as the schema owner (ADR-026); the application itself connects as DB_USER.
    user: ${DB_MIGRATION_USER:${DB_USER:payments}}
    password: ${DB_MIGRATION_PASSWORD:${DB_PASSWORD:}}
    placeholders:
      app_role: ${DB_APP_ROLE:}
  jackson:
    property-naming-strategy: SNAKE_CASE
    default-property-inclusion: non_null

server:
  port: ${PORT:8080}
  shutdown: graceful
  error:
    include-stacktrace: never
    include-message: never
  tomcat:
    max-swallow-size: 1MB
    max-http-form-post-size: 256KB

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  # Histograms for the latency SLOs and alerts (ADR-027); the slo entries add exact NFR-2 bucket boundaries.
  metrics:
    distribution:
      percentiles-histogram:
        "[http.server.requests]": true
        "[pg.provider.call]": true
      minimum-expected-value:
        "[http.server.requests]": 5ms
        "[pg.provider.call]": 10ms
      maximum-expected-value:
        "[http.server.requests]": 10s
        "[pg.provider.call]": 30s
      slo:
        "[http.server.requests]": 40ms,150ms,200ms
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING:0.1}
    export:
      otlp:
        enabled: ${OTLP_TRACING_ENABLED:false}
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTLP_TRACING_ENDPOINT:http://localhost:4318/v1/traces}
  logging:
    export:
      otlp:
        enabled: false
  otlp:
    metrics:
      export:
        enabled: false
  observations:
    key-values:
      application: payment-gateway

pg:
  payments:
    default-expiry: 15m
    processing-grace: 30m
    authorization-ttl: 5d
    max-attempts: 5
    supported-currencies: [INR]
  idempotency:
    ttl: 7d
    lease: 30s
  # Per merchant, per API instance (ADR-011): the effective global limit is roughly this x the instance count.
  rate-limit:
    enabled: true
    read:
      per-second: 200
      burst: 400
    write:
      per-second: 100
      burst: 200
  checkout:
    public-base-url: ${PG_CHECKOUT_BASE_URL:http://localhost:8080}
    result-ttl: 1h
  workers:
    enabled: ${PG_WORKERS_ENABLED:true}
    batch-size: 50
  retention:
    provider-webhooks: 180d
    merchant-events: 90d
    batch-size: 5000
    max-batches-per-run: 200
  reconciliation:
    exception-sla: 48h
    zone: Asia/Kolkata
  webhooks:
    outbound:
      connect-timeout: 2s
      read-timeout: 5s
      allow-private-targets: false
      require-https: true
    inbound:
      max-attempts: 10
      # Optional per-provider source CIDRs (e.g. the PSP's published webhook IPs); unlisted providers accept any source.
      allowed-sources: {}
  api:
    max-request-body: 256KB
  security:
    admin-tokens: ${PG_ADMIN_TOKENS:}
    data-encryption-key: ${PG_DATA_ENCRYPTION_KEY:}
    api-key-mode: ${PG_API_KEY_MODE:test}
  providers:
    http:
      connect-timeout: 2s
      read-timeout: 10s
    mock:
      enabled: false
    # Razorpay adapter (ADR-030). Merchants link their own keys (rzp_test_ on a TEST deployment, rzp_live_ on LIVE) with
    # PUT /admin/v1/merchants/{id}/provider-accounts/RAZORPAY and point Razorpay's webhook at the returned webhook_path.
    # upi-s2s: true once Razorpay has enabled server-to-server UPI for the platform; otherwise UPI uses the hosted page.
    razorpay:
      enabled: false
      base-url: https://api.razorpay.com/v1
      upi-s2s: false
      hosted-page-ttl: 15m
    # Cashfree adapter (ADR-031). Merchants link client_id and client_secret (from the sandbox on a TEST deployment).
    # base-url defaults by deployment mode: sandbox.cashfree.com/pg on TEST, api.cashfree.com/pg on LIVE.
    # upi-s2s: true once Cashfree has enabled Order Pay (seamless) for the platform; otherwise UPI uses the hosted link.
    cashfree:
      enabled: false
      api-version: "2025-01-01"
      upi-s2s: false
      hosted-page-ttl: 15m
  risk:
    review-threshold: 20000000
    block-threshold: 100000000
    velocity-window: 10m
    max-attempts-per-customer: 10
    blocked-vpas: []
    blocked-ips: []
    blocked-emails: []
    blocked-customer-references: []
    # Optional external fraud-scoring service (ADR-016). Timeouts and errors send the payment to manual review.
    # external:
    #   url: https://risk.example.com/v1/score
    #   secret: ${PG_RISK_EXTERNAL_SECRET}
    #   timeout: 800ms
