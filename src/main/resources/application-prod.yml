management:
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING:0.05}
    export:
      otlp:
        enabled: ${OTLP_TRACING_ENABLED:true}
  server:
    port: ${MANAGEMENT_PORT:8081}

logging:
  structured:
    format:
      console: ecs

# Behind the ALB: take the client IP and scheme from X-Forwarded-* sent by internal (VPC) proxies only.
server:
  forward-headers-strategy: native

pg:
  workers:
    enabled: ${PG_WORKERS_ENABLED:false}
  providers:
    mock:
      enabled: false
  checkout:
    public-base-url: ${PG_CHECKOUT_BASE_URL}
  # A sandbox deployment sets PG_API_KEY_MODE=test and uses PSP sandbox credentials.
  security:
    api-key-mode: ${PG_API_KEY_MODE:live}
