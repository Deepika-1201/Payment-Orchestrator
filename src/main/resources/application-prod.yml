management:
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING:0.05}
    export:
      otlp:
        enabled: ${OTLP_TRACING_ENABLED:true}
  server:
    port: ${MANAGEMENT_PORT:8081}

logging:
  structured:
    format:
      console: ecs
    json:
      customizer: com.payments.gateway.shared.logging.RedactingJsonMembersCustomizer

# Behind the ALB: take the client IP and scheme from X-Forwarded-* sent by internal (VPC) proxies only.
server:
  forward-headers-strategy: native

# Database (ADR-026): DB_URL must carry sslmode=verify-full&sslrootcert=/app/certs/rds-global-bundle.pem, and DB_USER is
# the application role. API and worker tasks never migrate; a one-off task with PG_MIGRATE_ONLY=true and the
# migration role's credentials runs before each deploy (MigrationTask).
spring:
  flyway:
    enabled: ${DB_MIGRATE_ON_START:false}
    placeholders:
      app_role: ${DB_APP_ROLE:gateway_app}

pg:
  workers:
    enabled: ${PG_WORKERS_ENABLED:false}
  providers:
    mock:
      enabled: false
  checkout:
    public-base-url: ${PG_CHECKOUT_BASE_URL}
  # A sandbox deployment sets PG_API_KEY_MODE=test and uses PSP sandbox credentials.
  security:
    api-key-mode: ${PG_API_KEY_MODE:live}
