name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
      # v5, not v6: v6 bundles a proprietary caching component under separate terms of use.
      - uses: gradle/actions/setup-gradle@v5
      - name: Build and test
        run: ./gradlew --no-daemon build
      - name: Dependency scan of the application jar (Trivy, fixable HIGH and above)
        run: |
          docker run --rm -v "$PWD/build/libs:/jars:ro" aquasec/trivy:0.74.0 rootfs --quiet --scanners vuln \
            --exit-code 1 --ignore-unfixed --severity HIGH,CRITICAL /jars
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: build/reports/tests

  terraform:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.16.4
          terraform_wrapper: false
      - name: Format
        run: terraform fmt -recursive -check
      - name: Validate and test every module with mocked providers (no AWS credentials)
        env:
          TF_PLUGIN_CACHE_DIR: ${{ runner.temp }}/terraform-plugins
        run: |
          mkdir -p "$TF_PLUGIN_CACHE_DIR"
          for dir in modules/* environments/prod; do
            echo "::group::$dir"
            terraform -chdir="$dir" init -backend=false -input=false -no-color
            terraform -chdir="$dir" validate -no-color
            if [ -d "$dir/tests" ]; then terraform -chdir="$dir" test -no-color; fi
            echo "::endgroup::"
          done
      - name: Security scan (Trivy, MEDIUM and above)
        run: |
          docker run --rm -v "$PWD:/src:ro" aquasec/trivy:0.74.0 config --quiet --exit-code 1 \
            --severity MEDIUM,HIGH,CRITICAL /src

  container:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - name: Check and unit-test alert rules (promtool)
        run: |
          docker run --rm --entrypoint promtool -v "$PWD/deploy/observability/prometheus:/p:ro" -w /p/tests \
            prom/prometheus:v3.15.0 test rules payment-gateway-test.yml slow-burn-test.yml
          docker run --rm --entrypoint promtool \
            -v "$PWD/deploy/observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro" \
            -v "$PWD/deploy/observability/prometheus/rules:/etc/prometheus/rules:ro" \
            prom/prometheus:v3.15.0 check config /etc/prometheus/prometheus.yml
      - name: Start the application with the observability stack
        run: OTLP_TRACING_ENABLED=true docker compose --profile observability up -d --build
      - name: Verify metrics, rules, dashboard and traces
        run: bash deploy/observability/verify-stack.sh
      - name: Load test, smoke profile (k6)
        run: |
          docker run --rm --network host -v "$PWD/load-tests:/scripts:ro" grafana/k6:2.3.0 run --quiet \
            -e PROFILE=smoke -e METRICS_URL=http://localhost:8080/actuator/prometheus /scripts/payment-flow.js
      - name: Image scan (Trivy, fixable HIGH and above in OS packages and libraries)
        run: |
          docker tag "$(docker inspect --format '{{.Image}}' "$(docker compose ps -q app)")" payment-gateway:ci
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.74.0 image --quiet \
            --scanners vuln --exit-code 1 --ignore-unfixed --severity HIGH,CRITICAL payment-gateway:ci
      - name: Show logs
        if: failure()
        run: docker compose --profile observability logs --no-color --tail 200
      - name: Stop the stack
        if: always()
        run: docker compose --profile observability down -v
