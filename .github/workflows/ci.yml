name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and test
        run: ./gradlew --no-daemon build
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: build/reports/tests

  container:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Check and unit-test alert rules (promtool)
        run: |
          docker run --rm --entrypoint promtool -v "$PWD/deploy/observability/prometheus:/p:ro" -w /p/tests \
            prom/prometheus:v3.15.0 test rules payment-gateway-test.yml slow-burn-test.yml
          docker run --rm --entrypoint promtool \
            -v "$PWD/deploy/observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro" \
            -v "$PWD/deploy/observability/prometheus/rules:/etc/prometheus/rules:ro" \
            prom/prometheus:v3.15.0 check config /etc/prometheus/prometheus.yml
      - name: Start the application with the observability stack
        run: OTLP_TRACING_ENABLED=true docker compose --profile observability up -d --build
      - name: Verify metrics, rules, dashboard and traces
        run: bash deploy/observability/verify-stack.sh
      - name: Show logs
        if: failure()
        run: docker compose --profile observability logs --no-color --tail 200
      - name: Stop the stack
        if: always()
        run: docker compose --profile observability down -v
